name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions: {}

# A commit pushed to main and tagged triggers two runs. Each run publishes every
# tag for its commit (releases, main, sha), so the later one supersedes the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

# Plain docker CLI on native runners; the only action is a SHA-pinned actions/checkout.
jobs:
  meta:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      releases: ${{ steps.meta.outputs.releases }}
    steps:
      - name: Find release tags on this commit
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # shellcheck disable=SC2016 # $vars are for GraphQL and jq
          releases=$(
            {
              if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
                echo "$GITHUB_REF_NAME"
              fi
              gh api graphql --paginate \
                -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" \
                -f query='query($owner: String!, $name: String!, $endCursor: String) {
                  repository(owner: $owner, name: $name) {
                    refs(refPrefix: "refs/tags/", first: 100, after: $endCursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes { name target { oid ... on Tag { target { oid } } } }
                    }
                  }
                }' \
                --jq '.data.repository.refs.nodes[]
                  | select(.name | startswith("v"))
                  | select((.target.target.oid // .target.oid) == $ENV.GITHUB_SHA)
                  | .name'
            } | sort -uV
          )
          version="sha-${GITHUB_SHA::7}"
          if [[ -n "$releases" ]]; then
            version=$(tail -n1 <<<"$releases")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "releases=$(paste -sd' ' <<<"$releases")" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest-amd64: ${{ steps.build.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.build.outputs.digest-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push by digest
        id: build
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx create --use --driver docker-container
          docker buildx build \
            --platform "linux/$ARCH" \
            --build-arg "VERSION=$VERSION" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --output "type=image,name=$image,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "$RUNNER_TEMP/metadata.json" \
            .
          echo "digest-$ARCH=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/metadata.json")" >> "$GITHUB_OUTPUT"

  publish:
    needs: [meta, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Create multi-arch manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_AMD64: ${{ needs.build.outputs.digest-amd64 }}
          DIGEST_ARM64: ${{ needs.build.outputs.digest-arm64 }}
          RELEASES: ${{ needs.meta.outputs.releases }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=()
          latest=false
          for release in $RELEASES; do
            version="${release#v}"
            tags+=("$image:$version")
            # prereleases (v1.2.3-rc.1) don't move latest
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest=true
            fi
          done
          if [[ "$latest" == true ]]; then
            tags+=("$image:latest")
          fi
          # only move main if it hasn't advanced past this commit
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$main" == "$GITHUB_SHA" ]]; then
            tags+=("$image:main")
          fi
          if [[ "$main" == "$GITHUB_SHA" || "$GITHUB_REF" == refs/heads/main ]]; then
            tags+=("$image:sha-${GITHUB_SHA::7}")
          fi
          if (( ${#tags[@]} == 0 )); then
            echo "nothing to publish" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            "${tags[@]/#/--tag=}" \
            "$image@$DIGEST_AMD64" "$image@$DIGEST_ARM64"
          docker buildx imagetools inspect "${tags[0]}" | tee -a "$GITHUB_STEP_SUMMARY"
